<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumnos · Portal EAP</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar-mobile">
    <button id="btnMenuMovil">☰</button>
    <span>Portal EAP</span>
    <span></span>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Portal de Seguimiento y Acompañamiento Pedagógico</h1>
      <span id="sidebarNombre"></span><br>
      <span id="sidebarRol"></span>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main-content" id="main">
    <div class="section-heading">
      <div>
        <h2 class="page-title">Alumnos</h2>
        <p class="page-subtitle">Consulte y filtre los alumnos en seguimiento pedagógico</p>
      </div>
      <button class="btn btn-primary hidden" id="btnNuevoAlumno">Nuevo alumno</button>
    </div>

    <div class="card">
      <div class="filters-bar">
        <input class="form-control" type="text" id="filtroBusqueda" placeholder="Buscar por nombre o apellido">
        <input class="form-control" type="text" id="filtroCurso" placeholder="Curso">
        <input class="form-control" type="text" id="filtroDivision" placeholder="División">
        <select class="form-control" id="filtroEstado">
          <option value="">Todos los estados</option>
          <option value="En seguimiento">En seguimiento</option>
          <option value="Necesita apoyo">Necesita apoyo</option>
          <option value="Seguimiento intensivo">Seguimiento intensivo</option>
          <option value="En proceso de mejora">En proceso de mejora</option>
          <option value="Finalizado">Finalizado</option>
        </select>
        <select class="form-control" id="filtroArea"></select>
      </div>
      <div id="estadoAlumnos" class="hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Alumno</th><th>Curso</th><th>División</th><th>Estado</th><th>Áreas</th></tr>
          </thead>
          <tbody id="tablaAlumnosBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="modalNuevoAlumno">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Nuevo alumno</h3>
      <button class="modal-close" id="btnCerrarModalNuevo">×</button>
    </div>
    <div id="estadoModalNuevo" class="hidden"></div>
    <form id="formNuevoAlumno">
      <div class="form-row">
        <div class="form-group">
          <label for="nuevoNombre">Nombre</label>
          <input class="form-control" type="text" id="nuevoNombre" required>
        </div>
        <div class="form-group">
          <label for="nuevoApellido">Apellido</label>
          <input class="form-control" type="text" id="nuevoApellido" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="nuevoCurso">Curso</label>
          <input class="form-control" type="text" id="nuevoCurso" required>
        </div>
        <div class="form-group">
          <label for="nuevoDivision">División</label>
          <input class="form-control" type="text" id="nuevoDivision" required>
        </div>
        <div class="form-group">
          <label for="nuevoTurno">Turno</label>
          <select class="form-control" id="nuevoTurno" required>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Vespertino">Vespertino</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="nuevoEstado">Estado de seguimiento</label>
          <select class="form-control" id="nuevoEstado" required>
            <option value="En seguimiento">En seguimiento</option>
            <option value="Necesita apoyo">Necesita apoyo</option>
            <option value="Seguimiento intensivo">Seguimiento intensivo</option>
            <option value="En proceso de mejora">En proceso de mejora</option>
            <option value="Finalizado">Finalizado</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nuevoAreaInicial">Área inicial (opcional)</label>
          <select class="form-control" id="nuevoAreaInicial">
            <option value="">Sin asignar</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="nuevoObservaciones">Observaciones generales</label>
        <textarea class="form-control" id="nuevoObservaciones"></textarea>
      </div>
      <button class="btn btn-primary" id="btnGuardarNuevoAlumno" type="submit">Guardar alumno</button>
    </form>
  </div>
</div>

<script type="module" src="js/alumnos.js"></script>
</body>
</html>
