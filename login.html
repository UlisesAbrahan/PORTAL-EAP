<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Portal de Seguimiento y Acompañamiento Pedagógico</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Portal de Seguimiento y Acompañamiento Pedagógico</h1>
    <p class="subtitle">EPET N°1</p>
    <div id="estadoLogin" class="hidden"></div>
    <form id="formLogin">
      <div class="form-group">
        <label for="email">Email institucional</label>
        <input class="form-control" type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="btnIngresar" type="submit">Iniciar sesión</button>
    </form>
  </div>
</div>
<script type="module">
import { configurarFormularioLogin, redirigirSiYaHaySesion } from "./js/auth.js";
redirigirSiYaHaySesion();
configurarFormularioLogin();
</script>
</body>
</html>
