<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de novedades · Portal EAP</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar-mobile">
    <button id="btnMenuMovil">☰</button>
    <span>Portal EAP</span>
    <span></span>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Portal de Seguimiento y Acompañamiento Pedagógico</h1>
      <span id="sidebarNombre"></span><br>
      <span id="sidebarRol"></span>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main-content" id="main">
    <div class="section-heading">
      <div>
        <h2 class="page-title">Gestión de novedades</h2>
        <p class="page-subtitle">Publique avisos, reuniones e información institucional</p>
      </div>
      <button class="btn btn-primary" id="btnNuevaNovedad">Nueva novedad</button>
    </div>
    <div id="estadoNovedadesGestion" class="hidden"></div>
    <div id="listaNovedadesGestion"></div>
  </main>
</div>

<div class="modal-overlay hidden" id="modalNovedad">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="tituloModalNovedad">Nueva novedad</h3>
      <button class="modal-close" id="btnCerrarModalNovedad">×</button>
    </div>
    <div id="estadoModalNovedad" class="hidden"></div>
    <form id="formNovedad">
      <input type="hidden" id="novedadIdEditando">
      <div class="form-group">
        <label for="novedadTitulo">Título</label>
        <input class="form-control" type="text" id="novedadTitulo" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="novedadTipo">Tipo</label>
          <select class="form-control" id="novedadTipo" required>
            <option value="Novedad">Novedad</option>
            <option value="Aviso">Aviso</option>
            <option value="Reunión">Reunión</option>
            <option value="Información">Información</option>
          </select>
        </div>
        <div class="form-group">
          <label for="novedadFecha">Fecha de publicación</label>
          <input class="form-control" type="date" id="novedadFecha" required>
        </div>
      </div>
      <div class="form-group">
        <label for="novedadContenido">Contenido</label>
        <textarea class="form-control" id="novedadContenido" required></textarea>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="novedadActiva"> Publicada / visible</label>
      </div>
      <button class="btn btn-primary" id="btnGuardarNovedad" type="submit">Guardar novedad</button>
    </form>
  </div>
</div>

<script type="module" src="js/novedades.js"></script>
</body>
</html>
