<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil · Portal EAP</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar-mobile">
    <button id="btnMenuMovil">☰</button>
    <span>Portal EAP</span>
    <span></span>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Portal de Seguimiento y Acompañamiento Pedagógico</h1>
      <span id="sidebarNombre"></span><br>
      <span id="sidebarRol"></span>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main-content" id="main">
    <h2 class="page-title">Mi perfil</h2>

    <div class="card">
      <p><strong>Nombre:</strong> <span id="perfilNombre"></span></p>
      <p><strong>Email:</strong> <span id="perfilEmail"></span></p>
      <p><strong>Rol:</strong> <span id="perfilRol"></span></p>
      <p><strong>Área:</strong> <span id="perfilArea"></span></p>
      <p><strong>Estado de cuenta:</strong> <span id="perfilEstado"></span></p>
    </div>

    <div class="card">
      <div class="section-heading"><h2>Cambiar contraseña</h2></div>
      <div id="estadoPassword" class="hidden"></div>
      <form id="formCambiarPassword">
        <div class="form-row">
          <div class="form-group">
            <label for="nuevaPassword">Nueva contraseña</label>
            <input class="form-control" type="password" id="nuevaPassword" required minlength="8">
          </div>
          <div class="form-group">
            <label for="repetirPassword">Repetir contraseña</label>
            <input class="form-control" type="password" id="repetirPassword" required minlength="8">
          </div>
        </div>
        <button class="btn btn-primary" id="btnCambiarPassword" type="submit">Actualizar contraseña</button>
      </form>
    </div>
  </main>
</div>
<script type="module" src="js/perfil.js"></script>
</body>
</html>
